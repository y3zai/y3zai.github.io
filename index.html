<!DOCTYPE html>
<html lang="en">
<head>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-9YZVWZNQWQ');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y³Z</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #f8f6f2;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    .logo {
      font-size: clamp(5rem, 14vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #0ABAB5;
    }

    .logo .y { color: #4285F4; }
    .logo .three { color: #FBBC05; }
    .logo .z { color: #EA4335; }

    .logo .cursor::after {
      content: '|';
      font-weight: 300;
      color: rgba(134, 132, 126, 0.5);
      animation: blink 1s ease-in-out infinite;
      margin-left: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .logo sup {
      font-size: 0.38em;
      position: relative;
      top: -0.55em;
      font-weight: 700;
    }

    .links {
      margin-top: 3.5rem;
      display: flex;
      justify-content: center;
      gap: 5rem;
    }

    .links a {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 500;
      color: #1d1d1f;
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #4285F4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span id="text"></span><span class="cursor"></span></div>
    <div class="links">
      <a href="https://yy.y3z.ai">YY</a>
      <a href="https://yz.y3z.ai">YZ</a>
    </div>
  </div>
  <script>
    const el = document.getElementById('text');
    const phrases = [
      { html: '<span class="y">Y</span><sup class="three">3</sup><span class="z">Z</span>', plain: 'Y3Z' },
      { html: 'The Time Is Now', plain: 'The Time Is Now' }
    ];
    let phraseIndex = 0;
    const TYPE_SPEED = 100;
    const DELETE_SPEED = 70;
    const PAUSE = 2000;

    function typePhrase(phrase, callback) {
      const chars = phrase.plain.split('');
      let i = 0;
      const interval = setInterval(() => {
        i++;
        // Build HTML progressively: for Y3Z use styled HTML, for plain text just slice
        if (phrase.plain === 'Y3Z') {
          const partial = phrase.plain.slice(0, i);
          let html = '';
          for (const c of partial) {
            if (c === 'Y') html += '<span class="y">Y</span>';
            else if (c === '3') html += '<sup class="three">3</sup>';
            else if (c === 'Z') html += '<span class="z">Z</span>';
          }
          el.innerHTML = html;
        } else {
          el.textContent = phrase.plain.slice(0, i);
        }
        if (i >= chars.length) {
          clearInterval(interval);
          setTimeout(callback, PAUSE);
        }
      }, TYPE_SPEED);
    }

    function deletePhrase(callback) {
      const current = el.textContent;
      let len = current.length;
      const interval = setInterval(() => {
        len--;
        if (el.querySelector('sup')) {
          // It's the styled Y3Z
          const partial = 'Y3Z'.slice(0, len);
          let html = '';
          for (const c of partial) {
            if (c === 'Y') html += '<span class="y">Y</span>';
            else if (c === '3') html += '<sup class="three">3</sup>';
            else if (c === 'Z') html += '<span class="z">Z</span>';
          }
          el.innerHTML = html;
        } else {
          el.textContent = current.slice(0, len);
        }
        if (len <= 0) {
          clearInterval(interval);
          setTimeout(callback, 300);
        }
      }, DELETE_SPEED);
    }

    function loop() {
      typePhrase(phrases[phraseIndex], () => {
        deletePhrase(() => {
          phraseIndex = (phraseIndex + 1) % phrases.length;
          loop();
        });
      });
    }

    loop();
  </script>
</body>
</html>
